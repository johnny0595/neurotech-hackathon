board:
  id: NEUROPAWN_KNIGHT_BOARD_IMU
  serial_port: /dev/cu.usbserial-A5069RR4
  active_exg_channels: [2]
  rld_channels: [2]
  channel_gains:
    1: 12
    2: 12
    3: 12
    4: 12
    5: 12
    6: 12
    7: 12
    8: 12
  gain: 12
  buffer_size: 450000
  configure_channels: true
  stream_settle_seconds: 2.0
  config_command_delay_seconds: 0.5

channel_map:
  1: unused
  2: eyebrow
  3: unused
  4: unused

imu:
  use_magnetometer: false
  gyro_units: auto
  beta: 0.200
  pivot_z: 0.250
  swap_pitch_roll: false
  invert_roll: false

mouse:
  dead_zone_degrees: 1.25
  speed_px_per_second_per_degree: 70.0
  max_speed_px_per_second: 1400.0
  smoothing: 0.35
  response_curve: 1.35
  full_tilt_degrees: 18.0
  motion_boost_px_per_second_per_degree: 8.0
  invert_x: false
  invert_y: false
  center_roll_degrees: 0.0
  center_pitch_degrees: 0.0
  x_axis_roll: 1.0
  x_axis_pitch: 0.0
  y_axis_roll: 0.0
  y_axis_pitch: 1.0

jaw:
  channels: [2]
  sampling_rate: 125.0
  short_clench_seconds: 0.5
  relax_seconds: 2.0
  hold_seconds: 3.0
  pre_event_seconds: 0.5
  post_event_seconds: 0.8
  short_clench_reps: 20
  hold_reps: 0
  initial_neutral_seconds: 8.0
  final_neutral_seconds: 6.0
  event_min_seconds: 0.35
  event_max_seconds: 0.50
  relax_min_seconds: 1.2
  relax_max_seconds: 2.5
  hard_negative_reps: 5
  hard_negative_seconds: 0.75
  window_seconds: [0.25, 0.35, 0.50]
  window_step_seconds: 0.05
  positive_label: eyebrow_raise
  protocol_version: short_event_v2
  prompt_seed: 7
  profile_name: eyebrow
  event_threshold: 0.70
  hold_threshold: 0.70
